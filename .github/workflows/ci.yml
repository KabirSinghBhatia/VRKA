name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Bytecode compilation check
        run: python -m compileall -q -x '(\.venv|build|dist)' .

      - name: Module import validation
        run: python -c "import vrka_downloader, vrka_core, vrka_qml, vrka_platform; print('All core modules imported successfully.')"

      - name: Run unit test suite
        run: python -m unittest discover -s tests -v
